<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">Hydraulic sequential control illustration</title>
  <desc id="desc">Simplified technical illustration of two hydraulic cylinders connected through pressure-controlled sequence valves.</desc>
